# RustSec advisories in every pinned source's Cargo.lock (scripts/advisories): the issue
# "Rust advisories" lists them, and the run fails while one is a vulnerability. Weekly.
name: Rust advisories

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ github.token }}
      - name: Audit the pinned sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/advisories --issue
