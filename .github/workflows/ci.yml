name: CI

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Org variable CACHIX_NAME and secret CACHIX_AUTH_TOKEN. Without the token
      # (pull requests from forks) the cache is read-only.
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Format
        run: nix fmt -- --check $(git ls-files '*.nix')

      - name: Build and test every package and library
        run: nix flake check -L --keep-going
